name: Bug report
description: The plugin did something wrong, or the PDF does not look as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. A small note that shows the problem helps
        most; please leave out anything private.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → Obsidian2Typst.
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version and operating system
      placeholder: Obsidian 1.14.4, macOS 26
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, from opening the note to the result?
      placeholder: |
        1. Open the note below.
        2. Run "Export to PDF" with the preset "A5 print".
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Smallest note that shows it
      description: The Markdown of the note, and the preset if it matters.
      render: markdown
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the warnings from the warning report, and a screenshot of the page if it helps.
    validations:
      required: true
